<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secuencia de escáneres</title>
<style>
  :root {
    --ink: #0b0b10;
    --brand-red: #fe0000;
    --cyan: #2de2ff;
    --c-ink: #222222;
    --c-muted: #6a6a6a;
    --c-border: #dddddd;
    --c-line: #ebebeb;
    --c-soft: #f4f4f4;
    --amber: #e8a100;
    --shadow-xs: 0 1px 2px rgba(0,0,0,.06);
    --shadow-sm: 0 2px 8px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.05);
    --gutter: clamp(16px, 4vw, 40px);
    --nav-h: 60px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--c-ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm);
    display: grid; place-items: center; font-size: 16px; transition: transform .1s ease;
  }
  .icon-btn:hover { box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn.sm { width: 32px; height: 32px; font-size: 14px; }
  .icon-btn.on { background: var(--c-ink); color: #fff; }

  main { padding: 24px 0 80px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 var(--gutter) 8px; }
  .head h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1; }
  .head p { margin: 0; font-size: 13px; color: var(--c-muted); line-height: 1; }

  .toolbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
    padding: 10px var(--gutter); overflow-x: auto; scrollbar-width: none;
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--c-line);
  }
  .toolbar::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 38px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--c-border); border-radius: 999px; background: #fff; font-size: 14px; font-weight: 500;
    transition: border-color .2s ease, transform .1s ease; white-space: nowrap;
  }
  .chip:hover { border-color: var(--c-ink); }
  .chip:active { transform: scale(.96); }
  .chip.is-active { border: 2px solid var(--c-ink); padding: 0 15px; background: #f7f7f7; font-weight: 600; }
  .chip.primary { background: var(--c-ink); color: #fff; border-color: var(--c-ink); }
  .spacer { flex: 1; }

  /* Rejilla de tarjetas */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 20px;
    padding: 20px var(--gutter) 0;
  }
  .card { display: flex; flex-direction: column; min-width: 0; }
  .card.dragging { opacity: .4; }
  .card.over .media { border-color: var(--c-ink); border-width: 2px; }
  .card.swap-src .media { border: 2px solid var(--brand-red); }
  .card.selected .media { box-shadow: 0 0 0 3px var(--cyan); }
  .media {
    position: relative; aspect-ratio: 4 / 3; border: 1px solid var(--c-line); border-radius: 18px;
    background: #fff; box-shadow: var(--shadow-xs); overflow: hidden; display: grid; place-items: center; cursor: pointer;
  }
  .media img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; padding: 10px; user-select: none; -webkit-user-drag: none; }
  .empty { color: var(--c-muted); font-size: 13px; text-align: center; padding: 16px; line-height: 1.5; }
  .empty b { display: block; color: var(--c-ink); font-size: 14px; margin-bottom: 4px; }
  .tag {
    position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px; background: #fff;
    box-shadow: var(--shadow-xs); border: 1px solid var(--c-line); font-size: 12px; font-weight: 600;
  }
  .handle { position: absolute; top: 10px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #fff;
    box-shadow: var(--shadow-sm); display: grid; place-items: center; cursor: grab; font-size: 16px; color: var(--c-muted); }
  .actions { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .info { padding: 10px 4px 0; display: flex; flex-direction: column; gap: 4px; }
  .info .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name, .cmd {
    width: 100%; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 2px 0; border-radius: 0;
  }
  .name { font-size: 15px; font-weight: 600; }
  .cmd { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-muted); }
  .name:hover, .cmd:hover, .name:focus, .cmd:focus { border-bottom-color: var(--c-border); outline: none; }
  .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--c-ink); background: var(--c-ink); }
  .dot.alarm { background: var(--amber); border-color: var(--amber); }
  .dot.off { background: transparent; border-color: var(--c-border); }
  .legend { display: flex; gap: 16px; padding: 12px var(--gutter) 0; font-size: 12px; color: var(--c-muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 12px; height: 12px; border-width: 2px; }
  .add { aspect-ratio: 4/3; border: 2px dashed var(--c-border); border-radius: 18px; display: grid; place-items: center;
    color: var(--c-muted); font-weight: 500; transition: border-color .2s; }
  .add:hover { border-color: var(--c-ink); color: var(--c-ink); }

  /* Reproductor */
  #player { position: fixed; inset: 0; z-index: 100; background: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  #player.open { display: flex; }
  #player .step { font-size: 14px; font-weight: 600; color: var(--c-muted); letter-spacing: .06em; text-transform: uppercase; padding-bottom: 6px; }
  #player .pname { font-size: 18px; font-weight: 600; padding-bottom: 14px; text-align: center; }
  #player .stage { flex: 1; width: 100%; display: grid; place-items: center; overflow: hidden; padding: 0 3vw; }
  /* Escalado entero y sin suavizado: cada barra crece lo mismo y los bordes quedan nítidos */
  #player .stage img { display: block; background: #fff; image-rendering: pixelated; image-rendering: crisp-edges; }
  #player .stage .quiet { background: #fff; padding: 6vmin; }
  #player .noimg { color: var(--c-muted); font-size: 22px; }
  #player .dots { display: flex; gap: 6px; padding: 10px 0 8px; flex-wrap: wrap; justify-content: center; max-width: 90vw; }
  #player .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-border); }
  #player .dots i.done { background: var(--c-ink); opacity: .35; }
  #player .dots i.cur { background: var(--c-ink); width: 22px; border-radius: 8px; }
  #player .hint { font-size: 12px; color: var(--c-muted); padding-bottom: 14px; }
  #player .top { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; }
  #player .headtop { padding-top: 16px; text-align: center; }
  #player .stagewrap { flex: 1; width: 100%; display: flex; flex-direction: column; min-height: 0; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--c-ink); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  input[type=file] { display: none; }
</style>
</head>
<body>

<main>
  <div class="head">
    <h1>Secuencia</h1>
    <p id="count"></p>
  </div>

  <div class="toolbar">
    <button class="chip" id="chipWin" aria-pressed="false">Estación con Windows (sin alarma)</button>
    <span class="spacer"></span>
    <button class="chip" id="chipSwap">⇄ Intercambiar</button>
    <button class="chip" id="btnExport" title="Descarga datos.js con tus recortes: ponlo junto a index.html">⤓ Exportar</button>
    <button class="chip" id="btnImport" title="Importar copia">⤒ Importar</button>
    <button class="chip" id="btnReset" title="Restablecer plantilla (borra imágenes)">↺ Restablecer</button>
    <button class="chip primary" id="btnPlay">▶ Reproducir</button>
  </div>

  <div class="legend">
    <span><i class="dot"></i> Normal</span>
    <span><i class="dot alarm"></i> Alarma (se salta en Windows)</span>
    <span><i class="dot off"></i> Fuera del flujo</span>
    <span>Haz clic en la tarjeta y pega con Ctrl+V · Win+Shift+S para recortar</span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<section id="player" aria-label="Reproductor">
  <div class="top">
    <button class="icon-btn" id="pMinus" title="Más pequeño (−)">−</button>
    <button class="icon-btn" id="pPlus" title="Más grande (+)">+</button>
    <button class="icon-btn" id="pClose" title="Salir (Esc)">✕</button>
  </div>
  <div class="stagewrap">
    <div class="headtop"><div class="step" id="pStep"></div><div class="pname" id="pName"></div></div>
    <div class="stage" id="pStage"></div>
  </div>
  <div class="dots" id="pDots"></div>
  <div class="hint">Espacio / → / clic: siguiente · ←: atrás · + −: tamaño · R: repetir · Esc: salir</div>
</section>

<input type="file" id="filePick" accept="image/*">
<input type="file" id="fileImport" accept=".js,.json">
<div class="toast" id="toast"></div>

<!-- datos.js (opcional, junto a este archivo) guarda los recortes para llevarlos a otro equipo -->
<script src="datos.js"></script>
<script>
(function () {
  'use strict';

  var KEY = 'scanner-sequence-v1';

  // Plantilla por defecto. kind: normal | alarm | off
  function template() {
    var t = [
      ['QR inicial (autoenter + idioma)', '', 'normal'],
      ['Código de la base', '', 'normal'],
      ['Duración de la alarma', 'BT_ORD.', 'alarm'],
      ['Número 2', '2', 'alarm'],
      ['Número 5', '5', 'alarm'],
      ['Número 0', '0', 'alarm'],
      ['Número 0', '0', 'alarm'],
      ['Guardar', 'MNUSAV.', 'alarm'],
      ['Tipo de alarma', 'BT_ORW.', 'alarm'],
      ['Tono 2', '2', 'alarm'],
      ['Guardar', 'MNUSAV.', 'alarm'],
      ['Bajo alcance', 'BT_TXP1.', 'normal'],
      ['Base solo carga', 'BASLNK0.', 'normal'],
      ['Bloquear vínculo', 'BASCON0,DNG1.', 'normal'],
      ['Reescanear código de la base', '', 'normal'],
      ['Deshacer solo carga (referencia)', 'BASLNK1.', 'off'],
      ['Sustituir escáner (referencia)', 'BT_RPL1.', 'off']
    ];
    return t.map(function (r) { return newItem(r[0], r[1], r[2]); });
  }

  var uid = 0;
  function newItem(name, cmd, kind, img) {
    return { id: 'c' + Date.now().toString(36) + (uid++), name: name || 'Nuevo código', cmd: cmd || '', kind: kind || 'normal', img: img || '' };
  }

  var state = { items: [], windows: false, zoom: 0, savedAt: 0 };
  var selectedId = null;
  var swapId = null;
  var swapMode = false;

  // ---------- Persistencia ----------
  function valid(s) { return s && Array.isArray(s.items); }
  // Usa lo más reciente entre este navegador (localStorage) y datos.js
  function load() {
    var local = null, file = valid(window.SEQUENCE_DATA) ? window.SEQUENCE_DATA : null;
    try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); if (valid(s)) local = s; } } catch (e) {}
    if (file && (!local || (file.savedAt || 0) > (local.savedAt || 0))) {
      state = JSON.parse(JSON.stringify(file));
      if (local) setTimeout(function () { toast('Cargados los datos de datos.js (más recientes)'); }, 300);
    } else if (local) {
      state = local;
    } else {
      state.items = template();
    }
    if (typeof state.zoom !== 'number') state.zoom = 0;
  }
  function save() {
    state.savedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('No se pudo guardar (almacenamiento lleno). Exporta una copia.'); }
  }

  // ---------- Utilidades ----------
  var $ = function (id) { return document.getElementById(id); };
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  function idx(id) { return state.items.findIndex(function (i) { return i.id === id; }); }
  function move(from, to) {
    if (to < 0 || to >= state.items.length || from === to) return;
    var it = state.items.splice(from, 1)[0];
    state.items.splice(to, 0, it);
  }
  var KINDS = ['normal', 'alarm', 'off'];

  // Reduce la imagen (máx. 1200 px de ancho) conservando nitidez (PNG)
  function fileToData(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, max = 1200;
        if (w > max) { h = Math.round(h * max / w); w = max; }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        cb(c.toDataURL('image/png'));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }
  function setImage(id, file) {
    fileToData(file, function (data) {
      var i = idx(id); if (i < 0) return;
      state.items[i].img = data; save(); render();
    });
  }

  // ---------- Render ----------
  function render() {
    var grid = $('grid');
    grid.innerHTML = '';
    state.items.forEach(function (it, n) {
      var card = document.createElement('div');
      card.className = 'card' + (it.id === selectedId ? ' selected' : '') + (it.id === swapId ? ' swap-src' : '');
      card.dataset.id = it.id;
      card.draggable = false;

      var media = document.createElement('div');
      media.className = 'media';
      media.tabIndex = 0;
      media.innerHTML = it.img
        ? '<img alt="" src="' + it.img + '">'
        : '<div class="empty"><b>Sin imagen</b>Clic aquí y pega (Ctrl+V)<br>o arrastra un archivo</div>';

      var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = 'Paso ' + (n + 1);
      var handle = document.createElement('span'); handle.className = 'handle'; handle.textContent = '⠿'; handle.title = 'Arrastrar para ordenar';
      handle.draggable = true;

      var actions = document.createElement('div'); actions.className = 'actions';
      actions.appendChild(btn('↑', 'Subir', function () { move(n, n - 1); save(); render(); }));
      actions.appendChild(btn('↓', 'Bajar', function () { move(n, n + 1); save(); render(); }));
      actions.appendChild(btn('⇄', 'Intercambiar con otro', function () { startSwap(it.id); }, it.id === swapId));
      actions.appendChild(btn('⧉', 'Duplicar', function () {
        var c = JSON.parse(JSON.stringify(it)); c.id = newItem().id; state.items.splice(n + 1, 0, c); save(); render();
      }));
      actions.appendChild(btn('✕', 'Quitar', function () {
        if (confirm('¿Quitar "' + it.name + '"?')) { state.items.splice(n, 1); save(); render(); }
      }));

      media.appendChild(tag); media.appendChild(handle); media.appendChild(actions);

      var info = document.createElement('div'); info.className = 'info';
      var row = document.createElement('div'); row.className = 'row';
      var name = document.createElement('input'); name.className = 'name'; name.value = it.name; name.setAttribute('aria-label', 'Nombre');
      name.addEventListener('input', function () { it.name = name.value; save(); });
      var dot = document.createElement('button'); dot.className = 'dot ' + (it.kind === 'normal' ? '' : it.kind);
      dot.title = 'Tipo: ' + it.kind + ' (clic para cambiar)';
      dot.addEventListener('click', function () { it.kind = KINDS[(KINDS.indexOf(it.kind) + 1) % KINDS.length]; save(); render(); });
      row.appendChild(name); row.appendChild(dot);
      var cmd = document.createElement('input'); cmd.className = 'cmd'; cmd.value = it.cmd; cmd.placeholder = 'COMANDO'; cmd.setAttribute('aria-label', 'Comando');
      cmd.addEventListener('input', function () { it.cmd = cmd.value; save(); });
      info.appendChild(row); info.appendChild(cmd);

      card.appendChild(media); card.appendChild(info);

      // Selección / intercambio / carga de imagen
      media.addEventListener('click', function (e) {
        if (e.target.closest('.actions') || e.target.closest('.handle')) return;
        if (swapMode && swapId && swapId !== it.id) { doSwap(swapId, it.id); return; }
        selectedId = it.id; markSelected();
      });
      media.addEventListener('dblclick', function (e) {
        if (e.target.closest('.actions') || e.target.closest('.handle')) return;
        $('filePick').dataset.id = it.id; $('filePick').click();
      });
      media.addEventListener('dragover', function (e) { e.preventDefault(); card.classList.add('over'); });
      media.addEventListener('dragleave', function () { card.classList.remove('over'); });
      media.addEventListener('drop', function (e) {
        e.preventDefault(); card.classList.remove('over');
        var f = e.dataTransfer.files && e.dataTransfer.files[0];
        if (f && f.type.indexOf('image') === 0) { setImage(it.id, f); return; }
        var from = e.dataTransfer.getData('text/x-card');
        if (from) { move(idx(from), idx(it.id)); save(); render(); }
      });
      handle.addEventListener('dragstart', function (e) {
        e.dataTransfer.setData('text/x-card', it.id); e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
      });
      handle.addEventListener('dragend', function () { card.classList.remove('dragging'); });

      grid.appendChild(card);
    });

    var add = document.createElement('button'); add.className = 'add'; add.textContent = '+ Añadir código';
    add.addEventListener('click', function () {
      var it = newItem(); state.items.push(it); selectedId = it.id; save(); render();
    });
    grid.appendChild(add);

    $('count').textContent = playable().length + ' pasos en reproducción · ' + state.items.length + ' códigos';
    $('chipWin').classList.toggle('is-active', state.windows);
    $('chipWin').setAttribute('aria-pressed', state.windows);
    $('chipSwap').classList.toggle('is-active', swapMode);
  }
  function markSelected() {
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (c) {
      c.classList.toggle('selected', c.dataset.id === selectedId);
    });
  }
  function btn(txt, title, fn, on) {
    var b = document.createElement('button'); b.className = 'icon-btn sm' + (on ? ' on' : ''); b.textContent = txt; b.title = title;
    b.addEventListener('click', function (e) { e.stopPropagation(); fn(); });
    return b;
  }

  // ---------- Intercambio ----------
  function startSwap(id) {
    if (swapId === id) { swapId = null; swapMode = false; render(); return; }
    swapId = id; swapMode = true; render(); toast('Ahora pulsa la tarjeta con la que quieres intercambiar');
  }
  function doSwap(a, b) {
    var i = idx(a), j = idx(b);
    var t = state.items[i]; state.items[i] = state.items[j]; state.items[j] = t;
    swapId = null; swapMode = false; save(); render();
  }
  $('chipSwap').addEventListener('click', function () {
    swapMode = !swapMode; swapId = null; render();
    if (swapMode) toast('Pulsa ⇄ en una tarjeta y luego en la otra');
  });

  // ---------- Pegar / archivos ----------
  document.addEventListener('paste', function (e) {
    var tgt = e.target;
    if (tgt && tgt.tagName === 'INPUT') return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var k = 0; k < items.length; k++) {
      if (items[k].type.indexOf('image') === 0) {
        if (!selectedId) { toast('Haz clic primero en la tarjeta donde va el código'); return; }
        setImage(selectedId, items[k].getAsFile());
        toast('Imagen añadida');
        e.preventDefault(); return;
      }
    }
  });
  $('filePick').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (f) setImage(e.target.dataset.id, f); e.target.value = '';
  });

  // ---------- Opciones generales ----------
  $('chipWin').addEventListener('click', function () { state.windows = !state.windows; save(); render(); });

  $('btnReset').addEventListener('click', function () {
    if (confirm('Restablecer la plantilla borra TODAS las imágenes y cambios. ¿Continuar?')) {
      state = { items: template(), windows: false, zoom: 0, savedAt: 0 }; selectedId = null; swapId = null; swapMode = false; save(); render();
    }
  });
  $('btnExport').addEventListener('click', function () {
    save();
    var blob = new Blob(['window.SEQUENCE_DATA = ' + JSON.stringify(state) + ';\n'], { type: 'text/javascript' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'datos.js';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
  });
  $('btnImport').addEventListener('click', function () { $('fileImport').click(); });
  $('fileImport').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var txt = String(r.result).trim().replace(/^window\.SEQUENCE_DATA\s*=\s*/, '').replace(/;\s*$/, '');
        var s = JSON.parse(txt);
        if (!s || !Array.isArray(s.items)) throw 0;
        state = s; save(); render(); toast('Copia importada');
      } catch (x) { toast('Archivo no válido'); }
    };
    r.readAsText(f); e.target.value = '';
  });

  // ---------- Reproductor ----------
  var seq = [], pos = 0;
  function playable() {
    return state.items.filter(function (i) {
      if (i.kind === 'off') return false;
      if (i.kind === 'alarm' && state.windows) return false;
      return true;
    });
  }
  function openPlayer() {
    seq = playable();
    if (!seq.length) { toast('No hay pasos que reproducir'); return; }
    pos = 0; $('player').classList.add('open'); showStep();
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch (e) {}
  }
  function closePlayer() {
    $('player').classList.remove('open');
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  }
  function showStep() {
    var it = seq[pos];
    $('pStep').textContent = 'Paso ' + (pos + 1) + ' / ' + seq.length;
    $('pName').textContent = it.name + (it.cmd ? '  ·  ' + it.cmd : '');
    var st = $('pStage'); st.innerHTML = '';
    if (it.img) {
      var box = document.createElement('div'); box.className = 'quiet';
      var im = document.createElement('img'); im.alt = it.name;
      im.onload = function () { fit(im, st); };
      im.src = it.img; box.appendChild(im); st.appendChild(box);
    } else {
      var d = document.createElement('div'); d.className = 'noimg'; d.textContent = 'Este paso no tiene imagen'; st.appendChild(d);
    }
    var dots = $('pDots'); dots.innerHTML = '';
    seq.forEach(function (_, n) {
      var i = document.createElement('i'); i.className = n < pos ? 'done' : n === pos ? 'cur' : ''; dots.appendChild(i);
    });
  }
  function next() { if (pos < seq.length - 1) { pos++; showStep(); } else { toast('Fin de la secuencia · R para repetir'); } }
  function prev() { if (pos > 0) { pos--; showStep(); } }
  // Granit 1911i: ángulo horizontal de 31,6°, así que a 15–20 cm ve ~8,5–11 cm de ancho.
  // El código debe caber entero en ese campo con su margen: objetivo ~8 cm (≈300 px CSS).
  var TARGET_CSS_W = 300;
  // Factor entero en píxeles físicos, el más cercano al objetivo sin salirse de la pantalla
  function fit(im, st) {
    var dpr = window.devicePixelRatio || 1;
    var nw = im.naturalWidth, nh = im.naturalHeight;
    var pad = 2 * Math.min(window.innerWidth, window.innerHeight) * 0.06;
    var maxW = (st.clientWidth - pad) * dpr, maxH = (st.clientHeight - pad) * dpr;
    var cap = Math.max(1, Math.floor(Math.min(maxW / nw, maxH / nh)));
    var auto = Math.max(1, Math.min(cap, Math.round(TARGET_CSS_W * dpr / nw)));
    var f = Math.max(1, Math.min(cap, auto + state.zoom));
    im.style.width = (nw * f / dpr) + 'px';
    im.style.height = (nh * f / dpr) + 'px';
  }
  function zoom(d) { state.zoom = Math.max(-20, Math.min(20, state.zoom + d)); save(); showStep(); }
  window.addEventListener('resize', function () { if ($('player').classList.contains('open')) showStep(); });

  $('btnPlay').addEventListener('click', openPlayer);
  $('pClose').addEventListener('click', function (e) { e.stopPropagation(); closePlayer(); });
  $('pPlus').addEventListener('click', function (e) { e.stopPropagation(); zoom(1); });
  $('pMinus').addEventListener('click', function (e) { e.stopPropagation(); zoom(-1); });
  $('player').addEventListener('click', next);

  document.addEventListener('keydown', function (e) {
    var playing = $('player').classList.contains('open');
    if (!playing) return;
    // Enter NO avanza a propósito: un escáner con auto-enter podría saltarse un paso
    if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === '+' || e.key === '=') zoom(1);
    else if (e.key === '-') zoom(-1);
    else if (e.key === 'r' || e.key === 'R') { pos = 0; showStep(); }
    else if (e.key === 'Escape') closePlayer();
  });
  // Evita que un Enter de un escáner pulse botones con foco
  $('player').addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); }, true);

  load();
  render();
})();
</script>
</body>
</html>
